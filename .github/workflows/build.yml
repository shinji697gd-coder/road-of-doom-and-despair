name: Build Windows mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: v5.11.2
          target: Win64
      - uses: actions/upload-artifact@v4
        with:
          name: Road-of-Doom-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
